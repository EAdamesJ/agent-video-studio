[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-video-studio"
version = "0.1.0.dev0"
description = "Open-source, agent-native AI video creation and repurposing studio."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Enmanuel Adames" }]
keywords = ["ai-video", "video-editor", "mcp", "claude", "codex", "deepseek", "ffmpeg", "shorts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=2,<3"]
transcription = ["faster-whisper>=1.1,<2"]
speech = ["edge-tts>=7,<8"]
thumbnails = ["Pillow>=11,<13"]
youtube = ["google-api-python-client>=2.160,<3", "google-auth-oauthlib>=1.2,<2"]
all = [
  "mcp[cli]>=2,<3",
  "faster-whisper>=1.1,<2",
  "edge-tts>=7,<8",
  "Pillow>=11,<13",
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
agent-video-studio = "agent_video_studio.cli:app"
avs = "agent_video_studio.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_video_studio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
